name: Publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Gerar atualização e publicar
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean AutoRenderPreset.spec

      - name: Montar pacote de atualização
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $packageName = "AutoRenderStudio_Update_$version.zip"
          $packageRoot = Join-Path $PWD "release-package"
          $appRoot = Join-Path $packageRoot "AutoRenderPreset"

          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          Copy-Item "dist\AutoRenderPreset\AutoRenderPreset.exe" $appRoot
          Copy-Item "dist\AutoRenderPreset\_internal" $appRoot -Recurse
          Copy-Item "autorendericon.ico" $appRoot
          Copy-Item "docs\releases\${{ github.ref_name }}.md" (Join-Path $appRoot "LEIA-ME_ATUALIZACAO_$version.md")
          if (-not (Test-Path (Join-Path $appRoot "_internal\base_library.zip"))) {
            throw "Pacote incompleto: _internal nao foi copiado."
          }
          Compress-Archive -Path $appRoot -DestinationPath $packageName -CompressionLevel Optimal

          $hash = (Get-FileHash $packageName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName" | Set-Content "$packageName.sha256" -Encoding utf8

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $packageName = "AutoRenderStudio_Update_$version.zip"
          gh release create "${{ github.ref_name }}" `
            $packageName `
            "$packageName.sha256" `
            --verify-tag `
            --title "AutoRender Studio $version" `
            --notes-file "docs\releases\${{ github.ref_name }}.md"
