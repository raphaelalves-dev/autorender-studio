name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.11 no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Preparar FFmpeg para os testes de fotos
        run: |
          choco install ffmpeg --version=9.0.1 -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Executar testes
        run: python -m unittest discover -s tests -v
