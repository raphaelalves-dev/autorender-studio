<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AutoRender Studio</title>
  <desc id="description">Automação inteligente para produção de vídeo</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="0.55" stop-color="#11152B"/>
      <stop offset="1" stop-color="#081B28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="210" cy="180" rx="300" ry="250" fill="url(#glow)"/>
  <ellipse cx="1060" cy="80" rx="260" ry="220" fill="#0891B2" opacity="0.08"/>

  <g transform="translate(92 77)" filter="url(#shadow)">
    <rect width="210" height="206" rx="38" fill="#11182E" stroke="#475569" stroke-opacity="0.55"/>
    <rect x="18" y="18" width="174" height="170" rx="27" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M76 65L76 141L142 103Z" fill="url(#accent)"/>
    <path d="M51 164H158" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="72" cy="164" r="8" fill="#8B5CF6"/>
    <circle cx="105" cy="164" r="8" fill="#3B82F6"/>
    <circle cx="138" cy="164" r="8" fill="#22D3EE"/>
  </g>

  <g transform="translate(360 102)">
    <text x="0" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="63" font-weight="750" letter-spacing="-2">
      AutoRender Studio
    </text>
    <rect x="2" y="91" width="94" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="137" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">
      Automação inteligente para produção de vídeo
    </text>
    <g transform="translate(0 170)">
      <rect width="125" height="36" rx="18" fill="#7C3AED" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="62.5" y="24" text-anchor="middle" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">WINDOWS</text>
      <rect x="139" width="125" height="36" rx="18" fill="#2563EB" fill-opacity="0.18" stroke="#60A5FA" stroke-opacity="0.55"/>
      <text x="201.5" y="24" text-anchor="middle" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">PYTHON</text>
      <rect x="278" width="125" height="36" rx="18" fill="#0891B2" fill-opacity="0.18" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="340.5" y="24" text-anchor="middle" fill="#CFFAFE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">FFMPEG</text>
    </g>
  </g>

  <g transform="translate(1055 278)" opacity="0.72">
    <circle cx="0" cy="0" r="5" fill="#8B5CF6"/>
    <circle cx="22" cy="0" r="5" fill="#3B82F6"/>
    <circle cx="44" cy="0" r="5" fill="#22D3EE"/>
  </g>
</svg>
